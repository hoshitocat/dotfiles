onboarding = false
# Match the pane keybindings in .tmux.conf.
[keys]
prefix = "ctrl+t"

split_horizontal = "prefix+s"
split_vertical = "prefix+v"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
previous_agent = "prefix+i"
next_agent = "prefix+u"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[ui]
sidebar_width = 20
sidebar_min_width = 16
status_indicators = "dots"

[ui.toast]
delivery = "terminal"

[ui.sidebar.spaces]
row_gap = 1

rows = [
  ["state_icon", "workspace"],
]

[ui.sidebar.agents]
row_gap = 0

rows = [
  [
    "state_icon",
    { token = "pane", fg = "#89b4fa", bold = true, dim = false },
    "agent",
  ],
  [
    "workspace",
    { token = "tab", fg = "#f9e2af", bold = true, dim = false },
  ],
]
